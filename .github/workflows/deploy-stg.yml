name: Deploy to Staging

on:
  push:
    branches: [staging]
    paths:
      - 'aws/terraform/**'
      - 'aws/terraform-dependencies/**'
      - '.github/workflows/**'
  workflow_call:
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

env:
  ENVIRONMENT: stg
  AWS_REGION: ap-northeast-1
  TERRAFORM_VERSION: 1.3.9

jobs:
  security-scan:
    uses: ./.github/workflows/security-scan.yml
    with:
      scan-path: '.'

  plan-general:
    needs: security-scan
    uses: ./.github/workflows/terraform-plan.yml
    with:
      environment: stg
      service: '1.general'
      terraform-version: '1.3.9'
      aws-region: 'ap-northeast-1'
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  plan-order-processing:
    needs: security-scan
    uses: ./.github/workflows/terraform-plan.yml
    with:
      environment: stg
      service: '3.order-processing'
      terraform-version: '1.3.9'
      aws-region: 'ap-northeast-1'
    secrets: inherit

  build-lambda:
    needs: [plan-general, plan-order-processing]
    if: github.event_name == 'push'
    uses: ./.github/workflows/build-lambda.yml
    with:
      python-version: '3.9'
      lambda-source-path: 'aws/terraform-dependencies/lambda-function'

  # deploy-general:
  #   needs: build-lambda
  #   if: github.event_name == 'push'
  #   uses: ./.github/workflows/terraform-apply.yml
  #   with:
  #     environment: stg
  #     service: '1.general'
  #     terraform-version: ${{ env.TERRAFORM_VERSION }}
  #     aws-region: ${{ env.AWS_REGION }}
  #   secrets: inherit

  deploy-order-processing:
    needs: [build-lambda]
    if: github.event_name == 'push'
    uses: ./.github/workflows/terraform-apply.yml
    with:
      environment: stg
      service: '3.order-processing'
      terraform-version: '1.3.9'
      aws-region: 'ap-northeast-1'
      lambda-artifact-name: 'lambda-artifacts'
    secrets: inherit
