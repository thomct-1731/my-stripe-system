name: Terraform Apply

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment to deploy (dev/stg/prod)'
        required: true
        type: string
      service:
        description: 'Service to deploy'
        required: true
        type: string
      terraform-version:
        description: 'Terraform version'
        required: false
        type: string
        default: '1.3.9'
      aws-region:
        description: 'AWS region'
        required: false
        type: string
        default: 'ap-northeast-1'
      lambda-artifact-name:
        description: 'Name of Lambda artifact to download'
        required: false
        type: string
        default: ''
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
    outputs:
      apply-status:
        description: 'Apply status (success/failure)'
        value: ${{ jobs.terraform-apply.outputs.status }}

jobs:
  terraform-apply:
    name: Apply ${{ inputs.service }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest

    outputs:
      status: ${{ steps.apply.outcome }}

    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.outputs.outputs.dashboard-url }}

    defaults:
      run:
        working-directory: aws/terraform/envs/${{ inputs.environment }}/${{ inputs.service }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Lambda artifacts
        if: inputs.lambda-artifact-name != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.lambda-artifact-name }}
          path: lambda-packages/

      - name: Copy Lambda packages
        if: inputs.lambda-artifact-name != ''
        run: |
          if [ -d "../../../../../lambda-packages" ]; then
            cp ../../../../../lambda-packages/*.zip ./
            echo "✅ Lambda packages copied successfully"
            ls -la *.zip
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws-region }}

      - name: Symlink variables file
        run: |
          if [ ! -L _variables.tf ]; then
            ln -sf ../_variables.tf _variables.tf
          fi

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Apply
        id: apply
        run: |
          terraform apply \
            -var-file=../terraform.${{ inputs.environment }}.tfvars \
            -auto-approve \
            -input=false

      - name: Capture outputs
        id: outputs
        if: steps.apply.outcome == 'success'
        run: |
          # Get all outputs
          if terraform output webhook_endpoint_url > /dev/null 2>&1; then
            WEBHOOK_URL=$(terraform output -raw webhook_endpoint_url)
            echo "webhook-url=$WEBHOOK_URL" >> $GITHUB_OUTPUT
          fi

          if terraform output cloudwatch_dashboard_url > /dev/null 2>&1; then
            DASHBOARD_URL=$(terraform output -raw cloudwatch_dashboard_url)
            echo "dashboard-url=$DASHBOARD_URL" >> $GITHUB_OUTPUT
          fi

          if terraform output sns_topic_arn > /dev/null 2>&1; then
            SNS_ARN=$(terraform output -raw sns_topic_arn)
            echo "sns-arn=$SNS_ARN" >> $GITHUB_OUTPUT
          fi

      - name: Generate deployment summary
        if: always()
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** ${{ inputs.service }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ steps.apply.outcome == 'success' && '✅ Success' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.apply.outcome }}" == "success" ]; then
            echo "### 📊 Deployment Outputs" >> $GITHUB_STEP_SUMMARY

            if [ -n "${{ steps.outputs.outputs.webhook-url }}" ]; then
              echo "- **Webhook URL:** ${{ steps.outputs.outputs.webhook-url }}" >> $GITHUB_STEP_SUMMARY
            fi

            if [ -n "${{ steps.outputs.outputs.dashboard-url }}" ]; then
              echo "- **Dashboard:** ${{ steps.outputs.outputs.dashboard-url }}" >> $GITHUB_STEP_SUMMARY
            fi

            if [ -n "${{ steps.outputs.outputs.sns-arn }}" ]; then
              echo "- **SNS Topic:** ${{ steps.outputs.outputs.sns-arn }}" >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed for ${{ inputs.service }} in ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
