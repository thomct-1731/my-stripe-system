name: '[DEV] Deploy Orders Service'

on:
  push:
    branches:
      - develop
    paths:
      - 'aws/terraform/envs/dev/3.orders/**'
      - 'aws/terraform-dependencies/lambda-functions/orders/**'
      - '.github/workflows/deploy-orders-dev.yml'

jobs:
  deploy-dev:
    name: Deploy Orders Service to DEV
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Cần thiết cho OIDC
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-role # Thay bằng IAM Role cho GitHub Actions
          aws-region: ap-northeast-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.3.9

      - name: Terraform Init
        id: init
        run: terraform init
        working-directory: aws/terraform/envs/dev/3.orders

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
        working-directory: aws/terraform/envs/dev/3.orders

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false -out=tfplan
        working-directory: aws/terraform/envs/dev/3.orders
        continue-on-error: true

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: aws/terraform/envs/dev/3.orders
