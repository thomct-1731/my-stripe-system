name: Deploy to Development

on:
  push:
    branches: [develop]
    paths:
      - 'aws/terraform/**'
      - 'aws/terraform-dependencies/**'
      - '.github/workflows/deploy-dev.yaml'
      - '.github/workflows/*.yaml'
  pull_request:
    branches: [develop]
    paths:
      - 'aws/terraform/**'
      - 'aws/terraform-dependencies/**'
  workflow_dispatch:
    inputs:
      skip-plan:
        description: 'Skip terraform plan'
        required: false
        type: boolean
        default: false

# env:
#   ENVIRONMENT: dev
#   AWS_REGION: ap-northeast-1
#   TERRAFORM_VERSION: 1.3.9

jobs:
  security-scan:
    name: Security Scan
    uses: ./.github/workflows/security-scan.yaml
    with:
      scan-path: '.'
      upload-sarif: true

  plan-general:
    name: Plan General Infrastructure
    needs: security-scan
    if: github.event.inputs.skip-plan != 'true'
    uses: ./.github/workflows/terraform-plan.yaml
    with:
      environment: dev
      service: '1.general'
      terraform-version: '1.3.9'
      aws-region: 'ap-northeast-1'
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  plan-order-processing:
    name: Plan Order Processing
    needs: security-scan
    if: github.event.inputs.skip-plan != 'true'
    uses: ./.github/workflows/terraform-plan.yaml
    with:
      environment: dev
      service: '3.order-processing'
      terraform-version: '1.3.9'
      aws-region: 'ap-northeast-1'
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  build-lambda:
    name: Build Lambda
    needs: [plan-general, plan-order-processing]
    if: |
      always() &&
      (needs.plan-general.result == 'success' || needs.plan-general.result == 'skipped') &&
      (needs.plan-order-processing.result == 'success' || needs.plan-order-processing.result == 'skipped') &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/build-lambda.yaml
    with:
      python-version: '3.9'
      lambda-source-path: 'aws/terraform-dependencies/lambda-function'

  # deploy-general:
  #   name: Deploy General
  #   needs: build-lambda
  #   if: |
  #     github.event_name == 'push' &&
  #     github.ref == 'refs/heads/develop'
  #   uses: ./.github/workflows/terraform-apply.yaml
  #   with:
  #     environment: dev
  #     service: '1.general'
  #     terraform-version: ${{ env.TERRAFORM_VERSION }}
  #     aws-region: ${{ env.AWS_REGION }}
  #   secrets:
  #     AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  #     AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  deploy-order-processing:
    name: Deploy Order Processing
    needs: [build-lambda]
    # needs: [build-lambda, deploy-general]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/terraform-apply.yaml
    with:
      environment: dev
      service: '3.order-processing'
      terraform-version: '1.3.9'
      aws-region: 'ap-northeast-1'
      lambda-artifact-name: ${{ needs.build-lambda.outputs.artifact-name }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  validate-deployment:
    name: Validate Deployment
    runs-on: ubuntu-latest
    needs: deploy-order-processing
    if: success()

    env:
      AWS_REGION: ap-northeast-1

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate Lambda Functions
        run: |
          echo "## 🔍 Deployment Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check Lambda functions
          FUNCTIONS=$(aws lambda list-functions \
            --query "Functions[?contains(FunctionName, 'myproject-dev')].FunctionName" \
            --output json)

          FUNC_COUNT=$(echo $FUNCTIONS | jq '. | length')
          echo "### Lambda Functions: $FUNC_COUNT found" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "$FUNCTIONS" | jq '.' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Validate SQS Queues
        run: |
          # Check SQS queues
          QUEUES=$(aws sqs list-queues \
            --query "QueueUrls[?contains(@, 'myproject-dev')]" \
            --output json)

          QUEUE_COUNT=$(echo $QUEUES | jq '. | length')
          echo "### SQS Queues: $QUEUE_COUNT found" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "$QUEUES" | jq '.' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Validate SNS Topics
        run: |
          # Check SNS topics
          TOPICS=$(aws sns list-topics \
            --query "Topics[?contains(TopicArn, 'myproject-dev')].TopicArn" \
            --output json)

          TOPIC_COUNT=$(echo $TOPICS | jq '. | length')
          echo "### SNS Topics: $TOPIC_COUNT found" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "$TOPICS" | jq '.' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Check DynamoDB Tables
        run: |
          # Check DynamoDB tables
          TABLES=$(aws dynamodb list-tables \
            --query "TableNames[?contains(@, 'myproject-dev')]" \
            --output json)

          TABLE_COUNT=$(echo $TABLES | jq '. | length')
          echo "### DynamoDB Tables: $TABLE_COUNT found" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "$TABLES" | jq '.' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All validation checks completed successfully!" >> $GITHUB_STEP_SUMMARY

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-order-processing, validate-deployment]
    # needs: [deploy-general, deploy-order-processing, validate-deployment]
    if: always()

    steps:
      - name: Create deployment summary
        run: |
          echo "# 🚀 Development Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Status" >> $GITHUB_STEP_SUMMARY
          echo "- General Infrastructure: ${{ 'needs.deploy-general.result - skip' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Order Processing: ${{ needs.deploy-order-processing.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Validation: ${{ needs.validate-deployment.result }}" >> $GITHUB_STEP_SUMMARY
