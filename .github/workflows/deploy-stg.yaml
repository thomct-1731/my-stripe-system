name: Deploy to Staging

on:
  push:
    branches: [staging, main]
    paths:
      - 'aws/terraform/**'
      - 'aws/terraform-dependencies/**'
  workflow_dispatch:

env:
  ENVIRONMENT: stg
  AWS_REGION: ap-northeast-1
  TERRAFORM_VERSION: 1.3.9

jobs:
  security-scan:
    uses: ./.github/workflows/security-scan.yaml
    with:
      scan-path: '.'

  plan-general:
    needs: security-scan
    uses: ./.github/workflows/terraform-plan.yaml
    with:
      environment: stg
      service: '1.general'
    secrets: inherit

  plan-order-processing:
    needs: security-scan
    uses: ./.github/workflows/terraform-plan.yaml
    with:
      environment: stg
      service: '3.order-processing'
    secrets: inherit

  build-lambda:
    needs: [plan-general, plan-order-processing]
    if: github.event_name == 'push'
    uses: ./.github/workflows/build-lambda.yaml

  deploy-general:
    needs: build-lambda
    if: github.event_name == 'push'
    uses: ./.github/workflows/terraform-apply.yaml
    with:
      environment: stg
      service: '1.general'
    secrets: inherit

  deploy-order-processing:
    needs: [build-lambda, deploy-general]
    if: github.event_name == 'push'
    uses: ./.github/workflows/terraform-apply.yaml
    with:
      environment: stg
      service: '3.order-processing'
      lambda-artifact-name: ${{ needs.build-lambda.outputs.artifact-name }}
    secrets: inherit
