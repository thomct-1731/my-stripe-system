name: Deploy to Staging

on:
  push:
    branches: [staging]
    paths:
      - 'aws/terraform/**'
      - 'aws/terraform-dependencies/**'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  ENVIRONMENT: stg
  AWS_REGION: ap-northeast-1
  TERRAFORM_VERSION: 1.3.9

jobs:
  security-scan:
    uses: ./.github/workflows/security-scan.yaml
    with:
      scan-path: '.'

  plan-general:
    needs: security-scan
    uses: ./.github/workflows/terraform-plan.yaml
    with:
      environment: stg
      service: '1.general'
      terraform-version: ${{ env.TERRAFORM_VERSION }}
      aws-region: ${{ env.AWS_REGION }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  plan-order-processing:
    needs: security-scan
    uses: ./.github/workflows/terraform-plan.yaml
    with:
      environment: stg
      service: '3.order-processing'
      terraform-version: ${{ env.TERRAFORM_VERSION }}
      aws-region: ${{ env.AWS_REGION }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  build-lambda:
    needs: [plan-general, plan-order-processing]
    if: github.event_name == 'push'
    uses: ./.github/workflows/build-lambda.yaml
    with:
      python-version: '3.9'
      lambda-source-path: 'aws/terraform-dependencies/lambda-function'

  deploy-general:
    needs: build-lambda
    if: github.event_name == 'push'
    uses: ./.github/workflows/terraform-apply.yaml
    with:
      environment: stg
      service: '1.general'
      terraform-version: ${{ env.TERRAFORM_VERSION }}
      aws-region: ${{ env.AWS_REGION }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  deploy-order-processing:
    needs: [build-lambda, deploy-general]
    if: github.event_name == 'push'
    uses: ./.github/workflows/terraform-apply.yaml
    with:
      environment: stg
      service: '3.order-processing'
      terraform-version: ${{ env.TERRAFORM_VERSION }}
      aws-region: ${{ env.AWS_REGION }}
      lambda-artifact-name: ${{ needs.build-lambda.outputs.artifact-name }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
