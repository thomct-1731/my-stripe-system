name: Terraform Plan

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment to plan (dev/stg/prod)'
        required: true
        type: string
      service:
        description: 'Service to plan (e.g., 1.general, 3.order-processing)'
        required: true
        type: string
      terraform-version:
        description: 'Terraform version'
        required: false
        type: string
        default: '1.3.9'
      aws-region:
        description: 'AWS region'
        required: false
        type: string
        default: 'ap-northeast-1'
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
    outputs:
      plan-exitcode:
        description: 'Terraform plan exit code'
        value: ${{ jobs.terraform-plan.outputs.exitcode }}

jobs:
  terraform-plan:
    name: Plan ${{ inputs.service }} in ${{ inputs.environment }}
    runs-on: ubuntu-latest

    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}

    defaults:
      run:
        working-directory: aws/terraform/envs/${{ inputs.environment }}/${{ inputs.service }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws-region }}

      - name: Symlink variables file
        run: |
          if [ ! -L _variables.tf ]; then
            ln -sf ../_variables.tf _variables.tf
            echo "✅ Created symlink for _variables.tf"
          else
            echo "ℹ️  Symlink already exists"
          fi

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: |
          terraform init -input=false
          echo "✅ Terraform initialized successfully"

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var-file=../terraform.${{ inputs.environment }}.tfvars \
            -out=tfplan \
            -no-color \
            -input=false
        continue-on-error: true

      - name: Generate plan summary
        if: always()
        run: |
          echo "## 📋 Terraform Plan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** ${{ inputs.service }}" >> $GITHUB_STEP_SUMMARY
          echo "**Terraform Version:** ${{ inputs.terraform-version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.fmt.outcome }}" == "success" ]; then
            echo "✅ Format check passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️  Format check failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.validate.outcome }}" == "success" ]; then
            echo "✅ Validation passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Validation failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.plan.outcome }}" == "success" ]; then
            echo "✅ Plan generated successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Plan failed" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload plan artifact
        if: steps.plan.outcome == 'success'
        uses: actions/upload-artifact@v3
        with:
          name: tfplan-${{ inputs.environment }}-${{ inputs.service }}
          path: aws/terraform/envs/${{ inputs.environment }}/${{ inputs.service }}/tfplan
          retention-days: 5
